name: Deploy

on:
  push:
    branches: [main]
  # Public pages are prerendered from the PDS at build time. Publishing from the
  # studio dispatches this workflow straight away; the schedule picks up records
  # other apps write (Skyreader shares, Semble cards, photos).
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ vars.PUBLIC_SITE_URL }}
    permissions:
      # write: publishing a draft commits it from drafts/ to content/published/
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Merged drafts go to the PDS before the build so the prerender picks
      # them up. Only on main, and never on the hourly schedule.
      - name: Publish merged drafts
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
        run: npm run drafts:publish

      - name: Commit published drafts
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        run: |
          if [ -n "$(git status --porcelain drafts content/published)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A drafts content/published
            git commit -m "Publish drafts [skip ci]"
            git push
          fi

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=disnetdev --branch=${{ github.ref_name }}
