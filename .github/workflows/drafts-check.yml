name: Drafts check

on:
  pull_request:
    paths:
      - 'drafts/**'
      - 'scripts/publish-drafts.mjs'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run drafts:check
